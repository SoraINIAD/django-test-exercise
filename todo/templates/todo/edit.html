{% load static %}
<!DOCTYPE html>
<html lang="ja">

  <head>
    <title>To Do Application</title>
    <meta charset="UTF-8">
    <meta name="author" content="INIAD">
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
  </head>

  <body>
    <h1>タスクの編集</h1>
    <p>以下のフォームからタスクを編集できます。</p>
    <form action="{% url 'update' task.id%}" method="post">
      {% csrf_token %}
      <div>
        <label for="titleInput">タイトル</label><br>
        <input id="titleInput" name="title" type="text" placeholder="タイトルを入力" value="{{ task.title }}">
      </div>
      <div>
        <label for="dueInput">締切日</label><br>
        <input
          id="dueInput"
          name="due_at"
          type="datetime-local"
          value="{{ task.due_at|date:"Y-m-d H:i" }}"
          onclick="if (this.showPicker) this.showPicker()"
        >
      </div>
      <div>
        <button type="submit">編集を保存する</button>
      </div>
    </form>
    <br>
  </body>

</html>
